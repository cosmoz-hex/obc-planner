services:
  postgres:
    image: postgres:17
    container_name: obc-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - obc_postgres_data:/var/lib/postgresql/data
  kirocrew:
    image: ghcr.io/kirodotdev/kirocrew:stable
    container_name: kirocrew
    restart: unless-stopped
    ports:
      - "127.0.0.1:5476:5476"
    volumes:
      - kirocrew-home:/home/kirocrew
      - ${OBC_PLANNER_PATH}:/home/kirocrew/workspace/obc-planner
    environment:
      - KIROCREW_ALLOW_UNSANDBOXED=1
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - KIROCREW_OWNER_ID=${KIROCREW_OWNER_ID}
      - KIROCREW_WORKSPACE=/home/kirocrew/workspace/obc-planner

volumes:
  obc_postgres_data:
  kirocrew-home: