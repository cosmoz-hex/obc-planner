<div class="p-6">
  <h2 class="text-2xl font-bold mb-4">{{ 'pages.referentiel.title' | translate }}</h2>

  <wa-tab-group (wa-tab-show)="onTabChange($event)">
    @for (tab of tabs; track tab.panel) {
      <wa-tab [attr.panel]="tab.panel" [attr.active]="activeTab() === tab.panel ? true : null">
        <wa-icon [attr.name]="tab.icon" library="fa" slot="prefix"></wa-icon>
        {{ 'pages.referentiel.tabs.' + tab.panel | translate }}
      </wa-tab>
    }

    @for (tab of tabs; track tab.panel) {
      <wa-tab-panel [attr.name]="tab.panel" [attr.active]="activeTab() === tab.panel ? true : null">
      </wa-tab-panel>
    }
  </wa-tab-group>

  <div class="mt-4">
    <router-outlet></router-outlet>
  </div>
</div>
