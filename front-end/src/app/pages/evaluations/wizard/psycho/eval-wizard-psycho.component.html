<fieldset class="flex flex-col gap-1 py-1 border-0 px-0 mt-1 w-fit mx-auto">
  <legend>{{ 'evaluations.wizard.psycho.legend' | translate }}</legend>

  @for (label of labels(); track label; let i = $index) {
    <wa-checkbox (change)="onToggle(i, $event)">
      {{ label | translate }}
    </wa-checkbox>
  }
</fieldset>
