<wa-dialog
	style="--width: 70vw;"
  [attr.open]="open() ? true : null"
  [attr.label]="'evaluations.wizard.title' | translate"
  (wa-after-hide)="onDialogHide($event)">

  <app-wizard (validate)="onValidate()">

    <app-wizard-step [step]="1" [valid]="speed.valid()" label="evaluations.wizard.speed.title">
      <app-eval-wizard-speed #speed />
    </app-wizard-step>

    <app-wizard-step [step]="2" [valid]="strength.valid()" label="evaluations.wizard.strength.title">
      <app-eval-wizard-strength #strength />
    </app-wizard-step>

    <app-wizard-step [step]="3" [valid]="snatch.valid()" label="evaluations.wizard.snatch.title">
      <app-eval-wizard-snatch #snatch />
    </app-wizard-step>

    <app-wizard-step [step]="4" [valid]="clean.valid()" label="evaluations.wizard.clean.title">
      <app-eval-wizard-clean #clean />
    </app-wizard-step>

    <app-wizard-step [step]="5" [valid]="jerk.valid()" label="evaluations.wizard.jerk.title">
      <app-eval-wizard-jerk #jerk />
    </app-wizard-step>

    <app-wizard-step [step]="6" [valid]="squat.valid()" label="evaluations.wizard.squat.title">
      <app-eval-wizard-squat #squat />
    </app-wizard-step>

    <app-wizard-step [step]="7" [valid]="competition.valid()" label="evaluations.wizard.competition.title">
      <app-eval-wizard-competition #competition />
    </app-wizard-step>

    <app-wizard-step [step]="8" [valid]="endurance.valid()" label="evaluations.wizard.endurance.title">
      <app-eval-wizard-endurance #endurance />
    </app-wizard-step>

    @for (block of psychoBlocks; track block; let i = $index) {
      <app-wizard-step [step]="firstPsychoStep + i" [valid]="psycho.valid()" [label]="psychoLabel(block)">
        <app-eval-wizard-psycho #psycho [block]="block" />
      </app-wizard-step>
    }

    <app-wizard-step #summaryStepRef [step]="summaryStep" [valid]="true" label="evaluations.wizard.summary.title">
      @if (summaryStepRef.active()) {
        <app-eval-wizard-summary
          [speed]="speed.value()"
          [strength]="strength.value()"
          [snatch]="snatch.value()"
          [clean]="clean.value()"
          [jerk]="jerk.value()"
          [squatStep]="squat.value()"
          [competition]="competition.value()"
          [enduranceStep]="endurance.value()"
          [psycho]="psychoResults()" />
      }
    </app-wizard-step>

  </app-wizard>

</wa-dialog>
