<wa-page class="min-h-screen bg-slate-950 text-slate-100 font-sans">

  <!-- Sidebar estructurada dentro del slot de navegación/sidebar de Web Awesome -->

    <div>
      <!-- Header / Logo -->
      <div slot="navigation-header" class="flex items-center gap-3 px-5 py-5 border-b border-slate-800/80">
        <div class="w-9 h-9 rounded-lg bg-cyan-400 flex items-center justify-center font-bold text-slate-950 text-sm shadow-md shadow-cyan-500/20">
          OH
        </div>
        <div>
          <div class="font-bold text-sm text-slate-100 tracking-wide">OBC Haltero</div>

        <a
          routerLink="/athletes"

      <div class="flex items-center gap-2 mb-1">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        Mode Local — Hors ligne
      </div>
      <div>v1.0.0 — OBC Haltero</div>

  <!-- Content (Área principal que renderiza las vistas secundarias) -->
